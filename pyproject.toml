
[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "policyops-recovery-lab"
version = "0.0.1"
description = "A local data engineering project for safe policy snapshot ingestion."
requires-python = ">=3.11,<3.15"
dependencies = [
    "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
